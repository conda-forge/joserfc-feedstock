schema_version: 1

context:
  name: joserfc
  version: "1.7.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/joserfc-${{ version }}.tar.gz
  sha256: fb1cf6d2977318bef976c2ed2ef2167cc5f8ade8fc96f034e38f7abd656907c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography >=45.0.1

tests:
  - python:
      imports:
        - joserfc
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: The ultimate Python library for JOSE RFCs, including JWS, JWE, JWK, JWA, JWT
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://jose.authlib.org/en/dev/
  repository: https://github.com/authlib/joserfc

extra:
  recipe-maintainers:
    - jan-janssen
